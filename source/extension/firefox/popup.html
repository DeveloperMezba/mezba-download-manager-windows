<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mezba Download Manager</title><link rel="stylesheet" href="popup.css"></head>
<body><header><b>MDM</b><span>MEZBA DOWNLOAD MANAGER</span></header><h1>Make it yours.</h1><p class="muted">One video or the full playlist. Your choice.</p><label for="url">Video page or file link</label><input id="url" type="url" placeholder="https://…"><div class="row"><button id="inspect" class="primary">Find download options</button><button id="file">Save file</button></div><select id="sources" aria-label="Detected media sources"><option value="">Detected sources (if available)</option></select><section id="formats" hidden><label>Choose item, playlist and format</label><div id="quality"></div><button id="download" class="primary">Add to downloads</button></section><p id="status" role="status">Connecting to MDM…</p><button id="open">Open MDM app</button><footer>Direct link or Google Drive? Use Save file.<br>Video buttons appear beside visible players.</footer><script src="choices.js"></script><script src="popup.js"></script></body></html>
