<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MDM download progress</title><link rel="stylesheet" href="progress.css"></head><body><header><b>MDM</b><span>DOWNLOAD PROGRESS</span></header><h1 id="title">Connecting to your download…</h1><p id="state" role="status">Starting</p><progress id="bar" max="1" aria-label="Download progress"></progress><p id="details">Your download is being added to the queue.</p><p id="error" role="alert"></p><div class="buttons"><button id="pause" disabled>Pause</button><button id="folder">Open folder</button><button id="app">Open MDM</button><button id="reconnect" hidden>Reconnect</button></div><footer>Closing this window keeps the download running.</footer><script src="progress.js"></script></body></html>
