name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update source configuration
        shell: pwsh
        run: |
          $config = @{ repository = $env:GITHUB_REPOSITORY }
          $config | ConvertTo-Json | Set-Content source/update-source.json

      - name: Determine version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $v = $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            $v = (Get-Content VERSION -Raw).Trim()
          }
          "MDM_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Ensure build tools are available
        shell: pwsh
        run: |
          $gcc = (Get-Command gcc -ErrorAction SilentlyContinue).Source
          $windres = (Get-Command windres -ErrorAction SilentlyContinue).Source
          if (-not $gcc -or -not $windres) {
            $msys = "C:\msys64\mingw64\bin"
            if ((Test-Path "$msys\gcc.exe") -and (Test-Path "$msys\windres.exe")) {
              $gcc = "$msys\gcc.exe"
              $windres = "$msys\windres.exe"
            } else {
              choco install mingw -y --no-progress
              $gcc = "C:\ProgramData\mingw64\mingw64\bin\gcc.exe"
              $windres = "C:\ProgramData\mingw64\mingw64\bin\windres.exe"
            }
          }
          if (-not (Test-Path $gcc)) { throw "gcc.exe not found" }
          if (-not (Test-Path $windres)) { throw "windres.exe not found" }
          "CC_PATH=$gcc" | Out-File -FilePath $env:GITHUB_ENV -Append
          "WINDRES_PATH=$windres" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using gcc: $gcc"
          Write-Host "Using windres: $windres"

          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $candidates = @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe"
            )
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $candidates = @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe"
            )
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) {
            $makensis = Get-ChildItem -Path "C:\ProgramData\chocolatey\lib" -Filter makensis.exe -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $makensis) { throw "makensis.exe not found even after installing NSIS" }
          "MAKENSIS_PATH=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using makensis: $makensis"

      - name: Run Build Script
        shell: pwsh
        run: |
          python build/build.py --version "$env:MDM_VERSION" --cc "$env:CC_PATH" --windres "$env:WINDRES_PATH" --makensis "$env:MAKENSIS_PATH"

      - name: Verify Installer Output
        shell: pwsh
        run: |
          Get-ChildItem -Path dist

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS
