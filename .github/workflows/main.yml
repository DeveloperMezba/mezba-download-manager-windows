name: Windows Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update source configuration
        shell: pwsh
        run: |
          $config = @{ repository = $env:GITHUB_REPOSITORY }
          $config | ConvertTo-Json | Set-Content source/update-source.json

      - name: Determine version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/*') {
            $v = $env:GITHUB_REF_NAME
          } else {
            $v = (Get-Content VERSION -Raw).Trim()
          }
          "MDM_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install Dependencies & PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path "build/python-packages-lock.json") {
              python -c 'import json, subprocess; pkgs = json.load(open("build/python-packages-lock.json")); reqs = [p["project"] + "==" + p["version"] for p in pkgs]; subprocess.check_call(["pip", "install"] + reqs)'
          }

      - name: Ensure NSIS is available
        shell: pwsh
        run: |
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          if (-not $makensis) {
            $candidates = @(
              "C:\Program Files (x86)\NSIS\makensis.exe",
              "C:\Program Files\NSIS\makensis.exe"
            )
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) {
            choco install nsis -y --no-progress
            $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          }
          if (-not $makensis) { throw "makensis.exe not found even after installing NSIS" }
          "MAKENSIS_PATH=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Using makensis: $makensis"

      - name: Run Build Script
        shell: pwsh
        run: |
          python build/build.py --version "$env:MDM_VERSION" --makensis "$env:MAKENSIS_PATH"

      - name: Verify Installer Output
        shell: pwsh
        run: |
          Get-ChildItem -Path dist

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: dist/*.exe
