name: Windows Release

on:
push:
tags:
- 'v*'

jobs:
build-windows:
runs-on: windows-latest

steps:
  - name: Checkout Repository
    uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: '3.12'

  - name: Update source configuration
    shell: pwsh
    run: |
      @{repository=$env:GITHUB_REPOSITORY} | ConvertTo-Json | Set-Content source/update-source.json

  - name: Install Dependencies & PyInstaller
    shell: pwsh
    run: |
      python -m pip install --upgrade pip
      pip install pyinstaller
      if (Test-Path "build/python-packages-lock.json") {
          pip install -r build/python-packages-lock.json
      }

  - name: Run Build Script
    shell: pwsh
    run: |
      python build/build.py --version ${{ github.ref_name }}

  - name: Verify Installer Output
    shell: pwsh
    run: |
      Get-ChildItem -Path dist

  - name: Upload Release Asset
    uses: softprops/action-gh-release@v1
    if: startsWith(github.ref, 'refs/tags/')
    with:
      files: dist/*.exe
